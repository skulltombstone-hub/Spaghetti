name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: src/android/frontend/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle executable
        run: chmod +x src/android/frontend/gradlew

      - name: Build Android App Bundle and APK
        working-directory: src/android/frontend
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace

      # Os artifacts só são publicados em builds da main
      # ou em execuções manuais do workflow.
      - name: Upload Android App Bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: spaghetti-android-aab
          path: src/android/frontend/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Upload Android APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: spaghetti-android-apk
          path: src/android/frontend/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
