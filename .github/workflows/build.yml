name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: src/android/frontend/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle executable
        run: chmod +x src/android/frontend/gradlew

      - name: Build Android APK
        working-directory: src/android/frontend
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-android
          path: src/android/frontend/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
