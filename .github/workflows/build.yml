name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
          cache-dependency-path: src/android/frontend/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle executable
        run: chmod +x src/android/frontend/gradlew

      - name: Build release APK and AAB
        working-directory: src/android/frontend
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Stage Android artifacts
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          आउट="$RUNNER_TEMP/android-artifacts"
          mkdir -p "$OUT"

          find src/android/frontend/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp -v {} "$OUT"/ \;

          echo "Artifacts staged in:"
          ls -lah "$OUT"

      - name: Upload Android APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-android-apk
          path: ${{ runner.temp }}/android-artifacts/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload Android AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-android-aab
          path: ${{ runner.temp }}/android-artifacts/*.aab
          if-no-files-found: error
          retention-days: 1
